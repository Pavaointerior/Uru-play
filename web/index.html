<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ServidorTeste</title>
<link rel="stylesheet" href="cabecalho/cabecalho.css">
<link rel="stylesheet" href="grade1/grade1.css">
<link rel="stylesheet" href="grade2/grade2.css">
<link rel="stylesheet" href="player/player.css">
<link rel="stylesheet" href="suabiblioteca/suabiblioteca.css">
<link rel="stylesheet" href="rodape/rodape.css">
<style>html,body{margin:0;background:#000;min-height:100%}</style>
</head>
<body>

<div id="cabecalho"></div>
<div id="grade1"></div>
<div id="grade2"></div>
<div id="player"></div>
<div id="suabiblioteca"></div>
<div id="rodape"></div>

<script src="api.js"></script>
<script>
function carregar(nome) {
  fetch(nome + '/' + nome + '.html')
    .then(r => r.text())
    .then(t => {
      document.getElementById(nome).innerHTML = t;
      const s = document.createElement('script');
      s.src = nome + '/' + nome + '.js';
      document.body.appendChild(s);
    });
}

function trocarTela(nome) {
  document.getElementById('grade1').style.display = nome === 'busca' ? '' : 'none';
  var bib = document.getElementById('bib-tela');
  if (bib) bib.classList.toggle('bib-oculta', nome !== 'biblioteca');
  var g2 = document.getElementById('grade2-tela');
  if (g2) g2.classList.toggle('g2-oculta', nome !== 'descobertas');
}

carregar('cabecalho');
carregar('grade1');
carregar('grade2');
carregar('player');
carregar('suabiblioteca');
carregar('rodape');
</script>

</body>
</html>
