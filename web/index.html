<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uru Play</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 28px; box-sizing: border-box; text-align: center;
    color: #E4DFD2; font-family: sans-serif; -webkit-user-select: none; user-select: none;
  }
  .logo { width: min(72%, 300px); opacity: .75; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .2px; }
  p { margin: 0; max-width: 320px; font-size: 14px; line-height: 1.55; color: #8a8a8a; }
  .selo {
    margin-top: 6px; padding: 7px 16px; border-radius: 999px;
    border: 1px solid rgba(232, 146, 46, .45); color: #E8922E;
    font-size: 12px; letter-spacing: .4px;
  }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Urutau Play">
  <h1>Fase 0 concluída</h1>
  <p>Este APK é só o teste do encanamento: ele prova que o GitHub monta, assina
     e entrega o aplicativo, e que ele instala no celular.</p>
  <p>A interface real e as músicas entram na fase seguinte.</p>
  <div class="selo">versão 0.0.1</div>

</html>
