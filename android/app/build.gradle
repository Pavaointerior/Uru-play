plugins {
    id 'com.android.application'
}

android {
    namespace 'com.urutaustudios.uruplay'
    compileSdk 34

    defaultConfig {
        applicationId "com.urutaustudios.uruplay"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.2.0"

        // Só arm64 (celulares e tablets atuais): deixa o APK bem menor.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // O yt-dlp roda como programa a partir de bibliotecas nativas:
    // elas precisam ser extraídas para o disco na instalação.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
