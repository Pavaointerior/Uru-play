name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Garantir SDK 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Copiar a web para dentro do app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - name: Gerar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Resumo
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          {
            echo "### APK gerado"
            echo ""
            echo "\`$(basename "$APK")\` — $(du -h "$APK" | cut -f1)"
            echo ""
            echo "sha256: \`$(sha256sum "$APK" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: uru-play-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
